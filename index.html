<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card p-3 m-3">
        <form>

            <div class="row"><!--Titulo-->
                <div class="col">
                    <h3 class="bg-light p-3">
                        Payment form example
                    </h3>
                </div>
            </div>


            <div class="row"><!--Mensaje alerta-->
                <div class="col">
                    <p class="bg-danger-rgb p-3">
                        Some fields are missing
                    </p>
                </div>

            </div>


            <div class="row mb-3"><!--Primera linea-->

                <div class="col-sm-6">
                    <label for="numCard" class="form-label"><b>Card #</b></label>
                    <input type="text" class="form-control" id="numCard" placeholder="XXXXXXXXXX">
                </div>
                <div class="col-sm-3">
                    <label for="numCvc" class="form-label"><b>CVC #</b></label>
                    <input type="text" class="form-control" id="numCvc" placeholder="0000">
                </div>
                <div class="col-sm-3">
                    <label for="amound" class="form-label"><b>Amount $</b></label>
                    <input type="email" class="form-control" id="amound" placeholder="Amount">
                </div>
            </div>


            <div class="row mb-3"><!--Segunda linea-->

                <div class="col-sm-6">
                    <label for="firstName" class="form-label"><b>First Name</b></label>
                    <input type="text" class="form-control" id="firstName">
                </div>
                <div class="col-sm-6">
                    <label for="lastName" class="form-label"><b>Lastname</b></label>
                    <input type="text" class="form-control" id="lastName">
                </div>
            </div>


            <div class="row mb-3"><!--Tercera linea-->

                <div class="col-sm-6">
                    <label for="city" class="form-label"><b>City</b></label>
                    <input type="text" class="form-control" id="city">
                </div>
                <div class="col-sm-3">
                    <label for="state" class="form-label"><b>State</b></label>
                    <select class="form-select" aria-label="Default select example" id="state">
                        <option selected>Pick a state</option>
                        <option value="1">Madrid</option>
                        <option value="2">Cataluña</option>
                        <option value="3">Andalucía</option>
                    </select>
                </div>
                <div class="col-sm-3">
                    <label for="numPostal" class="form-label"><b>Postal code</b></label>
                    <input type="email" class="form-control" id="numPostal">
                </div>
            </div>


            <div class="row mb-3"><!--Cuarta linea-->
                <div class="col-sm-6">
                    <label for="accept" class="form-label"><b>We accept:</b></label>

                    <div class="col bg-secondary p-3 border rounded">

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1"
                                value="option1">
                            <label class="form-check-label" for="inlineRadio1">
                                <i class="fa-brands fa-cc-mastercard fa-lg" style="color: #ffffff;"></i>
                            </label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2"
                                value="option2">
                            <label class="form-check-label" for="inlineRadio2">
                                <i class="fa-brands fa-cc-visa fa-lg" style="color: #ffffff;"></i>
                            </label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio3"
                                value="option3">
                            <label class="form-check-label" for="inlineRadio3">
                                <i class="fab fa-cc-diners-club fa-lg" style="color: #ffffff;"></i>
                            </label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio4"
                                value="option4">
                            <label class="form-check-label" for="inlineRadio4">
                                <i class="fab fa-cc-amex fa-lg" style="color: #ffffff;"></i>
                            </label>
                        </div>

                    </div>

                </div>

                <div class="col-sm-6">
                    <label for="message" class="form-label"><b>Message</b></label>
                    <textarea class="form-control" id="message" rows="3"></textarea>
                    <p>Add any notes here</p>
                </div>
            </div>


            <div class="row"><!--Footer-->
                <div class="col bg-light p-3">
                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-end">
                        <button type="button" class="btn btn-secondary">Cancel</button>
                        <button type="button" class="btn btn-primary">Send</button>
                    </div>
                </div>
            </div>

        </form>
    </div>








    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>

</html>
